<div class="public-shell">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a routerLink="/" class="brand" aria-label="LogiCore, ir a la tienda">
        <app-logo />
        <span class="brand-name">LogiCore</span>
      </a>

      <nav class="nav" aria-label="Navegación principal">
        <a
          routerLink="/"
          routerLinkActive="nav-link-active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          <svg lucideStore [size]="18"></svg>
          <span class="nav-label">Tienda</span>
        </a>
        <a
          routerLink="/orders"
          routerLinkActive="nav-link-active"
          ariaCurrentWhenActive="page"
          class="nav-link"
        >
          <svg lucideClipboardList [size]="18"></svg>
          <span class="nav-label">Mis pedidos</span>
        </a>
        <a
          routerLink="/cart"
          routerLinkActive="nav-link-active"
          ariaCurrentWhenActive="page"
          class="nav-link cart-link"
        >
          <svg lucideShoppingCart [size]="18"></svg>
          <span class="nav-label">Carrito</span>
          @if (cart.count()) {
            <!-- track por valor: al cambiar la cantidad el nodo se recrea y repite la animación -->
            @for (count of [cart.count()]; track count) {
              <span class="cart-badge">{{ count }}<span class="sr-only"> artículos</span></span>
            }
          }
        </a>
      </nav>

      <app-user-menu>
        @if (auth.isAdmin()) {
          <a routerLink="/admin" class="user-menu-item">
            <svg lucideLayoutDashboard [size]="16"></svg>
            Panel de administración
          </a>
        }
      </app-user-menu>
    </div>
  </header>

  <main id="contenido" tabindex="-1">
    <router-outlet />
  </main>
</div>
