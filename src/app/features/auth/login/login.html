<div class="auth-page">
  <form class="auth-card" (appSubmit)="submit()">
    <div class="auth-brand">
      <a routerLink="/" class="brand-mark" aria-label="LogiCore, volver al inicio">L</a>
      <h1>LogiCore</h1>
      <p class="muted">Inicia sesión para continuar</p>
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        [(ngModel)]="email"
        #emailCtrl="ngModel"
        type="email"
        autocomplete="email"
        aria-describedby="email-error"
        required
        email
        autofocus
      />
      <app-field-error id="email-error" [control]="emailCtrl" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        [(ngModel)]="password"
        #passwordCtrl="ngModel"
        type="password"
        autocomplete="current-password"
        aria-describedby="password-error"
        required
      />
      <app-field-error id="password-error" [control]="passwordCtrl" />
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
      @if (busy()) {
        <span class="spinner"></span>
        Entrando…
      } @else {
        Entrar
      }
    </button>

    <p class="auth-alt">
      ¿No tienes cuenta?
      <a routerLink="/register">Crea una</a>
    </p>
  </form>
</div>
