<div class="auth-page">
  <form class="auth-card" (appSubmit)="submit()">
    <div class="auth-brand">
      <a routerLink="/" class="brand-link" aria-label="LogiCore, volver al inicio">
        <app-logo [size]="44" />
      </a>
      <h1>Crear cuenta</h1>
      <p class="muted">Únete a LogiCore</p>
    </div>

    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }

    <div class="field">
      <label for="name">Nombre</label>
      <input
        id="name"
        name="name"
        [(ngModel)]="name"
        #nameCtrl="ngModel"
        type="text"
        autocomplete="name"
        aria-describedby="name-error"
        required
        autofocus
      />
      <app-field-error id="name-error" [control]="nameCtrl" />
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        [(ngModel)]="email"
        #emailCtrl="ngModel"
        type="email"
        autocomplete="email"
        aria-describedby="email-error"
        required
        email
      />
      <app-field-error id="email-error" [control]="emailCtrl" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input
        id="password"
        aria-describedby="password-hint password-error"
        name="password"
        [(ngModel)]="password"
        #passwordCtrl="ngModel"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      />
      <small id="password-hint" class="field-hint">Mínimo 8 caracteres.</small>
      <app-field-error id="password-error" [control]="passwordCtrl" />
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="busy()">
      @if (busy()) {
        <span class="spinner"></span>
        Creando cuenta…
      } @else {
        Crear cuenta
      }
    </button>

    <p class="auth-alt">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</div>
